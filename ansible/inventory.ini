# =============================================================================
# Ansible Inventory
# Replace the values below with your actual server details.
# =============================================================================

[k3s_server]
k3s-node ansible_host=YOUR_SERVER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[k3s_server:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
