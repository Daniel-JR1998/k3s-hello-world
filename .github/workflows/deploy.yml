# =============================================================================
# GitHub Actions: Build, Push, and Deploy Hello World Nginx to k3s
#
# Required Repository Secrets (Settings → Secrets → Actions):
#   DOCKER_USERNAME     – Docker Hub username
#   DOCKER_PASSWORD     – Docker Hub password / access token
#   K3S_HOST            – IP or hostname of your k3s server
#   K3S_SSH_KEY         – Private SSH key for the k3s server (base64 encoded)
#   K3S_SSH_USER        – SSH user on the k3s server (e.g. ubuntu)
#   K3S_KUBECONFIG      – Contents of /etc/rancher/k3s/k3s.yaml (server cert)
# =============================================================================

name: CI/CD – Deploy Hello World to k3s

on:
  push:
    branches:
      - main
    paths:
      - "nginx/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths:
      - "nginx/**"
      - "k8s/**"

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/hello-world-nginx

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint / validate manifests
  # ---------------------------------------------------------------------------
  lint:
    name: Lint Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          wget -qO /tmp/kubeval.tar.gz \
            https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar -xzf /tmp/kubeval.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/kubeval

      - name: Validate Kubernetes manifests
        run: |
          # Substitute dummy values for envsubst placeholders before linting
          export DOCKER_IMAGE=nginx
          export IMAGE_TAG=latest
          for f in k8s/*.yaml; do
            envsubst < "$f" | kubeval --strict --kubernetes-version 1.28.0
          done

  # ---------------------------------------------------------------------------
  # Job 2: Build and push Docker image
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    # Only push on commits to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 3: Deploy to k3s
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production
      url: http://${{ secrets.K3S_HOST }}:30080

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          # Write the kubeconfig stored in the secret
          echo "${{ secrets.K3S_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          # Replace 127.0.0.1 with the real server IP so kubectl can reach it
          sed -i "s|127.0.0.1|${{ secrets.K3S_HOST }}|g" ~/.kube/config

      - name: Verify cluster connectivity
        run: kubectl get nodes

      - name: Substitute image tag in manifests
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          # Replace placeholders in deployment manifest
          for f in k8s/*.yaml; do
            envsubst '${DOCKER_IMAGE} ${IMAGE_TAG}' < "$f" > "/tmp/$(basename $f)"
          done

      - name: Apply namespace
        run: kubectl apply -f /tmp/00-namespace.yaml

      - name: Deploy application
        run: |
          kubectl apply -f /tmp/01-deployment.yaml
          kubectl apply -f /tmp/02-service.yaml

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/hello-world-nginx \
            -n hello-world \
            --timeout=120s

      - name: Verify pods are running
        run: kubectl get pods -n hello-world -o wide

      - name: Smoke test – check HTTP response
        run: |
          echo "Waiting for service to respond..."
          for i in $(seq 1 10); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
              http://${{ secrets.K3S_HOST }}:30080/ || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Application is responding with HTTP 200"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS – retrying in 5s..."
            sleep 5
          done
          echo "❌ Smoke test failed after 10 attempts"
          exit 1

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Deployment failed! Check the logs above for details."
          # Add Slack/email notification here if desired
