name: Deploy to k3s

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/hello-world-nginx:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" > ~/.kube/config
          sed -i "s|127.0.0.1|${{ secrets.K3S_HOST }}|g" ~/.kube/config

      - name: Deploy to k3s
        run: |
          kubectl set image deployment/hello-world-nginx \
            nginx=${{ secrets.DOCKER_USERNAME }}/hello-world-nginx:latest \
            -n hello-world
          kubectl rollout status deployment/hello-world-nginx -n hello-world
