---
# =============================================================================
# Service: hello-world-nginx
# Exposes the Nginx deployment via NodePort so it's reachable from outside
# the cluster without a LoadBalancer or Ingress controller.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: hello-world-nginx
  namespace: hello-world
  labels:
    app: hello-world-nginx
    app.kubernetes.io/managed-by: github-actions
spec:
  type: NodePort
  selector:
    app: hello-world-nginx
  ports:
    - name: http
      protocol: TCP
      port: 80           # ClusterIP port
      targetPort: 8080   # Container port
      nodePort: 30080    # Accessible at http://<NODE_IP>:30080
